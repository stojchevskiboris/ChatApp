<div *ngIf="loading" class="loading-container flex-content-center">
  <mat-progress-spinner color="primary" mode="indeterminate"></mat-progress-spinner>
</div>

<div class="mt-4">
  <h2>Requests Registry</h2>

  <div class="row bg-secondary-subtle p-3 g-3 mb-3 mt-3 rounded">
    <div class="col-md-3">
      <label class="form-label">From User ID</label>
      <input type="number" [(ngModel)]="searchModel.userFromId" name="userFromId" class="form-control"
        (keyup.enter)="search()" (change)="search()">
    </div>
    <div class="col-md-3">
      <label class="form-label">To User ID</label>
      <input type="number" [(ngModel)]="searchModel.userToId" name="userToId" class="form-control"
        (keyup.enter)="search()" (change)="search()">
    </div>
    <div class="col-md-3">
      <label class="form-label">Status</label>
      <select [(ngModel)]="searchModel.requestStatus" name="requestStatus" class="form-select" (change)="search()">
        <option [ngValue]="undefined">-- All --</option>
        <option [value]="1">Pending</option>
        <option [value]="2">Canceled</option>
        <option [value]="3">Accepted</option>
        <option [value]="4">Rejected</option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Is Deleted</label>
      <select [(ngModel)]="searchModel.isDeleted" name="isDeleted" class="form-select" (change)="search()">
        <option [ngValue]="undefined">-- All --</option>
        <option [ngValue]="true">Yes</option>
        <option [ngValue]="false">No</option>
      </select>
    </div>
    <div class="col-12 d-flex justify-content-start">
      <button type="submit" class="btn btn-outline-primary me-2" (click)="search()">Search</button>
      <button type="button" class="btn btn-outline-secondary" (click)="resetFilters()">Reset Filters</button>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="table-responsive">
        <table class="table table-bordered table-striped w-100 mb-0">
          <thead>
            <tr>
              <th>#</th>
              <th class="cursor-pointer" (click)="setSort('id')">
                ID <app-sort-arrow [isAsc]="isAsc" *ngIf="searchModel.sortColumn === 'id'"></app-sort-arrow>
              </th>
              <th>From User ID</th>
              <th>To User ID</th>
              <th>Status</th>
              <th>Is Deleted</th>
              <th>Created At</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let r of pagedResult?.items; let i = index">
              <td>{{ i + 1 }}</td>
              <td>{{ r.id }}</td>
              <td>{{ r.userFromId }}</td>
              <td>{{ r.userToId }}</td>
              <td>{{ getStatusLabel(r.requestStatus) }}</td>
              <td>{{ r.isDeleted ? 'Yes' : 'No' }}</td>
              <td>{{ r.createdAt | date:'short' }}</td>
              <td>
                <button class="btn btn-outline-secondary btn-sm me-2" (click)="editRequest(r)">
                  <mat-icon>edit</mat-icon>
                </button>
                <button class="btn btn-outline-danger btn-sm" (click)="deleteRequest(r.id)">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <mat-paginator [length]="pagedResult?.totalCount || 0" [pageSize]="searchModel.size"
        [pageSizeOptions]="[10, 20, 50, 100]" [showFirstLastButtons]="true" (page)="pageChanged($event)">
      </mat-paginator>
    </div>
  </div>
</div>
