<div *ngIf="loading" class="loading-container flex-content-center">
  <mat-progress-spinner color="primary" mode="indeterminate"></mat-progress-spinner>
</div>

<div class="mt-4">
  <h2>Roles Registry</h2>

  <div class="row bg-secondary-subtle p-3 g-3 mb-3 mt-3 rounded">
    <div class="col-md-3">
      <label class="form-label">First Name</label>
      <input type="text" [(ngModel)]="searchModel.firstName" name="firstName" class="form-control"
        (keyup.enter)="search()" (change)="search()">
    </div>
    <div class="col-md-3">
      <label class="form-label">Last Name</label>
      <input type="text" [(ngModel)]="searchModel.lastName" name="lastName" class="form-control"
        (keyup.enter)="search()" (change)="search()">
    </div>
    <div class="col-md-3">
      <label class="form-label">Username</label>
      <input type="text" [(ngModel)]="searchModel.username" name="username" class="form-control"
        (keyup.enter)="search()" (change)="search()">
    </div>
    <div class="col-md-3">
      <label class="form-label">Role</label>
      <select [(ngModel)]="searchModel.role" name="role" class="form-select" (change)="search()">
        <option [ngValue]="undefined">-- All --</option>
        <option [value]="0">User</option>
        <option [value]="1">Moderator</option>
        <option [value]="2">Admin</option>
      </select>
    </div>
    <div class="col-12 d-flex justify-content-start">
      <button type="submit" class="btn btn-outline-primary me-2" (click)="search()">Search</button>
      <button type="button" class="btn btn-outline-secondary" (click)="resetFilters()">Reset Filters</button>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="table-responsive">
        <table class="table table-bordered table-striped w-100 mb-0">
          <thead>
            <tr>
              <th>#</th>
              <th class="cursor-pointer" (click)="setSort('id')">
                ID <app-sort-arrow [isAsc]="isAsc" *ngIf="searchModel.sortColumn === 'id'"></app-sort-arrow>
              </th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Username</th>
              <th>Role</th>
              <th>Created At</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of pagedResult?.items; let i = index">
              <td>{{ i + 1 }}</td>
              <td>{{ user.id }}</td>
              <td>{{ user.firstName }}</td>
              <td>{{ user.lastName }}</td>
              <td>{{ user.username }}</td>
              <td>{{ getRoleLabel(user.role) }}</td>
              <td>{{ user.createdAt | date:'short' }}</td>
              <td>
                <button class="btn btn-outline-secondary btn-sm" (click)="editRole(user)">
                  <mat-icon>edit</mat-icon>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <mat-paginator [length]="pagedResult?.totalCount || 0" [pageSize]="searchModel.size"
        [pageSizeOptions]="[10, 20, 50, 100]" [showFirstLastButtons]="true" (page)="pageChanged($event)">
      </mat-paginator>
    </div>
  </div>
</div>
